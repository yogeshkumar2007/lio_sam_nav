controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0

    controller_plugins: ["FollowPath"]

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"

      time_steps: 56
      model_dt: 0.05
      batch_size: 2000
      iteration_count: 1

      vx_max: 1.0
      vx_min: -0.5
      vy_max: 0.0
      wz_max: 1.0

      ax_max: 1.5
      ax_min: -1.5
      ay_max: 0.0
      az_max: 0.0
      wz_std: 0.2
      vx_std: 0.2
      vy_std: 0.0

      prune_distance: 1.7
      transform_tolerance: 0.1
      temperature: 0.3
      gamma: 0.015

      motion_model: "DiffDrive"

      visualize: false
      publish_optimal_trajectory: false

      critics:
        - ConstraintCritic
        - CostCritic
        - GoalCritic
        - GoalAngleCritic
        - PathAlignCritic
        - PathFollowCritic
        - PathAngleCritic
        - PreferForwardCritic
        - TwirlingCritic

      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0

      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0

      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4

      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5

      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0
        threshold_to_consider: 0.5
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4

      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4

      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        threshold_to_consider: 0.5

      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5

      TwirlingCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0

planner_server:
  ros__parameters:
    use_sim_time: false

    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_smac_planner::SmacPlannerHybrid"

      tolerance: 0.5
      downsample_costmap: false
      downsampling_factor: 1

      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000

      max_planning_time: 5.0

      motion_model_for_search: "DUBIN"

      angle_quantization_bins: 72

      minimum_turning_radius: 0.5
      reverse_penalty: 2.0
      change_penalty: 0.0
      non_straight_penalty: 1.2
      cost_penalty: 2.0

      retrospective_penalty: 0.015

      lookup_table_size: 20.0

      cache_obstacle_heuristic: true

      smooth_path: true
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2

smoother_server:
  ros__parameters:
    use_sim_time: false

    smoother_plugins: ["simple_smoother"]

    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: false

    behavior_plugins:
      - spin
      - backup
      - drive_on_heading
      - wait

    spin:
      plugin: "nav2_behaviors::Spin"

    backup:
      plugin: "nav2_behaviors::BackUp"

    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"

    wait:
      plugin: "nav2_behaviors::Wait"

    cycle_frequency: 10.0
    local_frame: odom
    global_frame: odom
    transform_tolerance: 0.1

bt_navigator:
  ros__parameters:
    use_sim_time: false

    global_frame: odom
    robot_base_frame: base_link

    transform_tolerance: 0.1

    default_nav_to_pose_bt_xml: "/opt/ros/jazzy/share/nav2_bt_navigator/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml"

    default_nav_through_poses_bt_xml: "/opt/ros/jazzy/share/nav2_bt_navigator/behavior_trees/navigate_through_poses_w_replanning_and_recovery.xml"

    navigators:
      - navigate_to_pose
      - navigate_through_poses

    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"

    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"

velocity_smoother:
  ros__parameters:
    use_sim_time: false

    smoothing_frequency: 20.0
    scale_velocities: false

    feedback: "CLOSED_LOOP"

    max_velocity: [1.0, 0.0, 1.0]
    min_velocity: [-0.5, 0.0, -1.0]

    max_accel: [1.5, 0.0, 2.0]
    max_decel: [-1.5, 0.0, -2.0]

    odom_topic: "/lio_sam/mapping/odometry"

    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]

    velocity_timeout: 1.0

    enable_stamped_cmd_vel: false

global_costmap:
  global_costmap:
    ros__parameters:

      use_sim_time: false

      global_frame: odom
      robot_base_frame: base_link

      footprint: "[[0.50, 0.40], [0.50, -0.40], [-0.50, -0.40], [-0.50, 0.40]]"

      update_frequency: 5.0
      publish_frequency: 2.0

      resolution: 0.10

      track_unknown_space: true
      rolling_window: true

      width: 50
      height: 50

      robot_radius: 0.45

      plugins:
        - stvl_layer
        - inflation_layer

      stvl_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"

        enabled: true

        voxel_decay: 5.0
        decay_model: 0

        voxel_size: 0.10

        track_unknown_space: true

        mapping_mode: false

        mark_threshold: 0
        update_footprint_enabled: true

        combination_method: 1

        origin_z: 0.0
        z_resolution: 0.10
        z_voxels: 16

        max_obstacle_height: 2.0
        min_obstacle_height: 0.05

        publish_voxel_map: false

        observation_sources: lidar

        lidar:
          data_type: PointCloud2
          topic: /lio_sam/deskew/cloud_deskewed

          marking: true
          clearing: true

          obstacle_range: 15.0
          raytrace_range: 20.0

          min_obstacle_height: 0.05
          max_obstacle_height: 2.0

          expected_update_rate: 0.0
          observation_persistence: 0.0

          inf_is_valid: false

          clear_after_reading: true

          filter: "voxel"

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"

        enabled: true

        cost_scaling_factor: 3.0
        inflation_radius: 0.75

      always_send_full_costmap: true

local_costmap:
  local_costmap:
    ros__parameters:

      use_sim_time: false

      global_frame: odom
      robot_base_frame: base_link

      footprint: "[[0.50, 0.40], [0.50, -0.40], [-0.50, -0.40], [-0.50, 0.40]]"

      update_frequency: 10.0
      publish_frequency: 5.0

      rolling_window: true

      width: 10
      height: 10

      resolution: 0.10

      robot_radius: 0.45

      plugins:
        - stvl_layer
        - inflation_layer

      stvl_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"

        enabled: true

        voxel_decay: 3.0
        decay_model: 0

        voxel_size: 0.10

        track_unknown_space: false

        mapping_mode: false

        mark_threshold: 0
        update_footprint_enabled: true

        combination_method: 1

        origin_z: 0.0
        z_resolution: 0.10
        z_voxels: 16

        max_obstacle_height: 2.0
        min_obstacle_height: 0.05

        publish_voxel_map: false

        observation_sources: lidar

        lidar:
          data_type: PointCloud2
          topic: /lio_sam/deskew/cloud_deskewed

          marking: true
          clearing: true

          obstacle_range: 12.0
          raytrace_range: 15.0

          min_obstacle_height: 0.05
          max_obstacle_height: 2.0

          expected_update_rate: 0.0
          observation_persistence: 0.0

          inf_is_valid: false

          clear_after_reading: true

          filter: "voxel"

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"

        enabled: true

        cost_scaling_factor: 3.0
        inflation_radius: 0.75

      always_send_full_costmap: true

waypoint_follower:
  ros__parameters:
    use_sim_time: false

    loop_rate: 20

    stop_on_failure: false

    waypoint_task_executor_plugin: wait_at_waypoint

    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"

      enabled: false

      waypoint_pause_duration: 0
